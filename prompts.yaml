# PL->EN prompt mapping for the CLIP text encoder.
#
# Key   = exact tag name or category name as it appears in the database.
# Value = list of English terms fed to the CLIP text encoder.
#         Each term is expanded via the template: "a photo of {term}".
#         Multiple terms are averaged into a single prototype vector.
#
# Only tags/categories with auto_enabled=true AND an entry here are scored.
# Missing entry → label is skipped with a WARNING in the logs.
# Build this incrementally: add a new entry whenever you create a new auto-enabled label.

